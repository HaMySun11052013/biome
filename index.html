<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toilathangtoi?</title>
<!-- Favicon của trang web -->
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>
<body class="pre">
<div class="bg"><img src="images (3).jfif" alt="" onerror="this.style.display='none'"><div class="bg-shade"></div></div>
<div id="enter"><span>click to enter</span></div>

<div class="topbar">
  <div class="vol">
    <button id="muteBtn" title="Âm lượng"><iconify-icon id="muteIcon" icon="ri:volume-up-line"></iconify-icon></button>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
  </div>
  <button id="likeBtn" title="Thích"><iconify-icon icon="ri:heart-fill"></iconify-icon></button>
</div>

<main class="card">
  <section class="profile">
    <div class="av">
      <img class="avatar" id="avatar" src="avatar.png" alt="avatar" onerror="this.style.background='#fff'">
      <img class="frame" id="frame" alt="" hidden>
    </div>
    <div class="info">
      <div class="name"><h1 id="typed" class="glow"></h1><span class="cursor">|</span></div>
      <p class="bio">Bạn ghét tôi không?</p>
      <div class="socials">
        <a href="https://www.tiktok.com/@null.crystal.iruwachi" target="_blank" rel="noopener" title="TikTok"><iconify-icon class="glow-icon" icon="ic:baseline-tiktok"></iconify-icon></a>
        <a href="https://www.facebook.com/profile.php?id=61562801110387" target="_blank" rel="noopener" title="Facebook"><iconify-icon class="glow-icon" icon="ri:facebook-fill"></iconify-icon></a>
        <a href="https://roblox.com" target="_blank" rel="noopener" title="Roblox"><iconify-icon class="glow-icon" icon="simple-icons:roblox"></iconify-icon></a>
        <a href="https://discord.com/users/1279063616150310957" target="_blank" rel="noopener" title="Discord"><iconify-icon class="glow-icon" icon="ic:baseline-discord"></iconify-icon></a>
        <a href="https://github.com/HaMySun11052013" target="_blank" rel="noopener" title="GitHub"><iconify-icon class="glow-icon" icon="ri:github-fill"></iconify-icon></a>
      </div>
    </div>
  </section>

  <section class="discord" id="discord">
    <div class="dc-avatar">
      <img id="dcAvatar" src="" alt="">
      <img id="dcDeco" class="deco" src="" alt="" hidden>
      <span class="status" id="dcStatus"></span>
    </div>
    <div class="dc-info">
      <div class="dc-name"><span id="dcName">Đang tải...</span><span class="tag" id="dcTag"></span><span id="dcBadge"></span></div>
      <div class="dc-game" id="dcGame"></div>
      <div class="dc-time" id="dcTimeWrap" hidden><iconify-icon icon="mdi:controller"></iconify-icon><span id="dcTime"></span></div>
    </div>
  </section>

  <div class="stats">
    <span class="pk" data-tip="Likes"><iconify-icon icon="ri:heart-fill"></iconify-icon><b id="likes">0</b></span><i></i>
    <span data-tip="Profile Views"><iconify-icon icon="ri:eye-fill"></iconify-icon><b id="views">0</b></span><i></i>
    <span class="pk" data-tip="Location"><iconify-icon icon="ri:map-pin-fill"></iconify-icon><b>Bắc Ninh</b></span>
  </div>

  <section class="player">
    <img class="cover" src="cover.jfif" alt="" onerror="this.style.background='#111'">
    <div class="pl-main">
      <div class="title" id="songTitle">Give Me Your Love</div>
      <div class="bar">
        <span id="cur">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0">
        <span id="dur">0:00</span>
        <button id="prev"><iconify-icon icon="ri:skip-back-fill"></iconify-icon></button>
        <button id="play" class="play"><iconify-icon id="playIcon" icon="ri:play-fill"></iconify-icon></button>
        <button id="next"><iconify-icon icon="ri:skip-forward-fill"></iconify-icon></button>
      </div>
  </div>
  </section>
</main>

<audio id="audio" src="music.mp3" loop></audio>
<script src="script.js"></script>
</body>
</html>
