<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toilathangngu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <button id="muteBtn" title="Âm lượng">🔊</button>
  <button id="likeBtn" title="Thích">♥</button>
</div>

<main class="card">
  <section class="profile">
    <img class="avatar" id="avatar" src="avatar.png" alt="avatar" onerror="this.style.background='#fff'">
    <div class="info">
      <h1 id="typed" class="glow"></h1><span class="cursor">|</span>
      <p class="bio">Tạm biệt.</p>
      <div class="socials">
        <a href="https://tiktok.com" target="_blank" title="TikTok">♪</a>
        <a href="https://facebook.com" target="_blank" title="Facebook">f</a>
        <a href="https://roblox.com" target="_blank" title="Roblox">◼</a>
        <a href="https://discord.com/users/1279063616150310957" target="_blank" title="Discord">D</a>
        <a href="https://github.com/HaMySun11052013" target="_blank" rel="noopener" title="GitHub">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
    </div>
  </section>

  <section class="discord" id="discord">
    <div class="dc-avatar">
      <img id="dcAvatar" src="" alt="">
      <img id="dcDeco" class="deco" src="" alt="" hidden>
      <span class="status" id="dcStatus"></span>
    </div>
    <div class="dc-info">
      <div class="dc-name"><span id="dcName">Đang tải...</span><span class="tag" id="dcTag"></span></div>
      <div class="dc-game" id="dcGame"></div>
      <div class="dc-time" id="dcTime"></div>
    </div>
  </section>

  <div class="stats">
    <span>♥ <b id="likes">0</b></span><i></i>
    <span>👁 <b id="views">0</b></span><i></i>
    <span>📍 Bắc Ninh</span>
  </div>

  <section class="player">
    <img class="cover" src="cover.png" alt="" onerror="this.style.background='#111'">
    <div class="pl-main">
      <div class="title" id="songTitle">Give Me Your Love</div>
      <div class="bar">
        <span id="cur">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0">
        <span id="dur">0:00</span>
        <button id="prev">⏮</button>
        <button id="play" class="play">▶</button>
        <button id="next">⏭</button>
      </div>
    </div>
  </section>
</main>

<audio id="audio" src="music.mp3" loop></audio>
<script src="script.js"></script>
</body>
</html>
